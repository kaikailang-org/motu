name: macos

on:
  push:
    branches: [main]
    paths: ['c/**', 'motu/**', 'examples/**', 'kai.toml', '.github/workflows/macos.yml']
  workflow_dispatch:

jobs:
  cold-start:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install kai
        run: |
          curl -fsSL https://raw.githubusercontent.com/kaikailang-org/kaikai/main/install.sh | sh
          echo "$HOME/.kaikai/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string
          kai build examples/hello/main.kai -o build/hello
          for ex in md-viewer md-to-epub file-finder notes book; do kai build examples/$ex/main.kai -o build/$ex; done

      - name: Start to first paint; the first launch finds WebKit cold on this fresh machine
        id: launch
        run: |
          for i in 1 2 3 4; do
            t0=$(python3 -c 'import time; print(time.time_ns())')
            MOTU_PAGE='index.html#ready' perl -e "alarm 60; exec @ARGV" ./build/hello
            echo "launch $i: $(( ($(python3 -c 'import time; print(time.time_ns())') - t0) / 1000000 )) ms"
          done

      - name: Self-tests
        run: |
          MOTU_PAGE="index.html#spell=$RUNNER_TEMP/spell.png" perl -e "alarm 60; exec @ARGV" ./build/hello
          python3 tools/count-red.py "$RUNNER_TEMP/spell.png"
          MOTU_PAGE='index.html#selftest' perl -e "alarm 60; exec @ARGV" ./build/hello
          mkdir -p "$RUNNER_TEMP/book"
          MOTU_PAGE="index.html#selftest=$RUNNER_TEMP/book" perl -e "alarm 120; exec @ARGV" ./build/book | tee book.txt
          ! grep -E '^FAIL' book.txt
          MOTU_PAGE="index.html#selftest=$PWD/tests/data/harbour.md|$RUNNER_TEMP/md.pdf" perl -e "alarm 60; exec @ARGV" ./build/md-viewer | tee md.txt
          grep -E '^h1=Chapter One: The Harbour \| words=3420 \| footnotes=3 \| pdf=written$' md.txt
          C=$PWD/tests/data/chapters
          MOTU_PAGE="index.html#selftest=$C/1-arrival.md,$C/2-island.md,$C/3-notes.md||$RUNNER_TEMP/out.epub" perl -e "alarm 60; exec @ARGV" ./build/md-to-epub | tee epub.txt
          grep -E '^chapters=3-notes / The Island / Arrival \| progress=6 \| Wrote' epub.txt
          mkdir -p "$RUNNER_TEMP/notes"
          MOTU_PAGE="index.html#selftest=$RUNNER_TEMP/notes" perl -e "alarm 60; exec @ARGV" ./build/notes | tee notes.txt
          grep -F 'refused: path leaves the project' notes.txt
          MOTU_PAGE="index.html#selftest=$PWD" perl -e "alarm 60; exec @ARGV" ./build/file-finder | tee ff.txt
          grep -E '^([0-9]+) found in [0-9]+ ms \| \1 shown$' ff.txt

      - name: Backtrace
        if: failure()
        run: |
          MOTU_PAGE='index.html#ready' lldb --batch -o run -o 'thread backtrace all' -k 'thread backtrace all' -k quit ./build/hello 2>&1 | tail -120

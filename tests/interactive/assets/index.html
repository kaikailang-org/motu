<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Motu input</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; }
</style>
</head>
<body>
<p>Drop files here.</p>
<script>
  let wrap = true;
  motu.on('menu', (id) => {
    if (id === 'wrap') { wrap = !wrap; motu.invoke('wrap', { on: wrap }); }
  });
  motu.invoke('ready');
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>File Finder</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, system-ui, sans-serif; --muted: #888; }
  body { margin: 0; display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; gap: .5rem; padding: .75rem; border-bottom: 1px solid #8884; }
  header input { flex: 1; font: inherit; padding: .4rem .6rem; }
  button { font: inherit; }
  #root { color: var(--muted); padding: .25rem .75rem; font-size: .85rem; }
  ul { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
  li { padding: .4rem .75rem; border-bottom: 1px solid #8882; cursor: default; }
  li:hover { background: #8881; }
  li .path { font-weight: 500; }
  li .line { color: var(--muted); font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  footer { padding: .4rem .75rem; color: var(--muted); font-size: .85rem; border-top: 1px solid #8884; }
</style>
</head>
<body>
<header>
  <button id="pick">Folder…</button>
  <input id="q" placeholder="Search names and contents" autofocus>
</header>
<div id="root">No folder chosen</div>
<ul id="hits"></ul>
<footer id="status">Ready</footer>
<script>
  let root = null, current = null;
  const hits = document.getElementById('hits'), status = document.getElementById('status');
  document.getElementById('pick').onclick = async () => {
    const p = await motu.invoke('pick');
    if (p) { root = p; document.getElementById('root').textContent = p; run(); }
  };
  motu.on('hit', (d) => {
    if (!current || d.call !== current.id) return;
    const li = document.createElement('li');
    li.innerHTML = '<div class="path"></div><div class="line"></div>';
    li.querySelector('.path').textContent = d.path.slice(root.length + 1);
    li.querySelector('.line').textContent = d.line;
    li.ondblclick = () => motu.invoke('open', { path: d.path });
    li.oncontextmenu = (e) => { e.preventDefault(); motu.invoke('reveal', { path: d.path }); };
    hits.appendChild(li);
  });
  async function run() {
    if (current) motu.cancel(current);
    hits.textContent = '';
    const query = document.getElementById('q').value;
    if (!root || query.length < 2) { status.textContent = 'Ready'; current = null; return; }
    const t0 = performance.now();
    const call = motu.invoke('search', { root, query });
    current = call; status.textContent = 'Searching…';
    try {
      const n = await call;
      if (current === call) status.textContent = `${n} found in ${(performance.now() - t0).toFixed(0)} ms`;
    } catch (e) {
      if (e.message !== 'cancelled') status.textContent = 'error: ' + e.message;
    }
  }
  document.getElementById('q').oninput = run;
  if (location.hash.startsWith('#selftest=')) (async () => {
    root = decodeURIComponent(location.hash.slice(10));
    const q = document.getElementById('q');
    for (const partial of ['mo', 'mot', 'motu_']) { q.value = partial; run(); }
    while (status.textContent === 'Searching…' || status.textContent === 'Ready') await new Promise((r) => setTimeout(r, 20));
    await motu.invoke('motu.report', `${status.textContent} | ${hits.children.length} shown`);
  })();
</script>
</body>
</html>
